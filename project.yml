# Xcode-prosjektet lages av XcodeGen («xcodegen generate»), så det står ikke i repoet.
# To mål med samme kode (App/, med #if os(tvOS)/os(iOS) der de skiller seg) og samme bundle-id, så Apple TV, iPhone og
# iPad er én app i App Store Connect og TestFlight: Fyrlys (tvOS) og FyrlysMobil (iPhone og iPad).
name: Fyrlys
options:
  bundleIdPrefix: no.fyrlys
  deploymentTarget:
    tvOS: "17.0"
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: nb

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.15"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

packages:
  FyrlysCore:
    path: Core

targets:
  Fyrlys:
    type: application
    platform: tvOS
    sources:
      - path: App
        excludes:
          - "Mobil.xcassets"
      # favorittene til Top Shelf (felles med utvidelsen)
      - path: TopShelf/SharedFavorites.swift
    dependencies:
      - package: FyrlysCore
      - target: FyrlysTopShelf
      # VLC for filmer og serier Apples avspiller ikke kan (mkv …); hentes av tools/vlckit.sh
      - framework: Vendor/TVVLCKit.xcframework
        embed: true
    info:
      path: build/Fyrlys-Info.plist
      properties:
        CFBundleDisplayName: Fyrlys
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: nb
        CFBundleLocalizations: [nb, en]
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
        # leverandørene sender ofte over http
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # fyrlys://kanal/<id> fra Top Shelf
        CFBundleURLTypes:
          - CFBundleURLName: no.fyrlys.tv
            CFBundleURLSchemes: [fyrlys]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.fyrlys.tv
        PRODUCT_NAME: Fyrlys
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO

  # Top Shelf: favorittene på hjemskjermen til Apple TV når Fyrlys har fokus
  FyrlysTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
    info:
      path: build/FyrlysTopShelf-Info.plist
      properties:
        CFBundleDisplayName: Fyrlys
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # kreves av App Store Connect for 64-bits binærfiler, også i utvidelser
        UIRequiredDeviceCapabilities: [arm64]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.fyrlys.tv.topshelf
        PRODUCT_NAME: FyrlysTopShelf
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES

  FyrlysUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests
    dependencies:
      - target: Fyrlys
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.fyrlys.tv.uitests
        TEST_TARGET_NAME: Fyrlys
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "3"

  FyrlysMobil:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Assets.xcassets"
    dependencies:
      - package: FyrlysCore
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
    info:
      path: build/FyrlysMobil-Info.plist
      properties:
        CFBundleDisplayName: Fyrlys
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: nb
        CFBundleLocalizations: [nb, en]
        UILaunchScreen: {}
        # ingen fast modus: lys eller mørk som enheten, til man velger selv i appen
        UIRequiredDeviceCapabilities: [arm64]
        # iPhone: ikke opp ned; iPad: alle (kreves for delt skjerm)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # lyd og bilde-i-bilde når appen ligger i bakgrunnen
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.fyrlys.tv
        PRODUCT_NAME: Fyrlys
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  FyrlysMobilUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITestsMobil
    dependencies:
      - target: FyrlysMobil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.fyrlys.tv.mobil.uitests
        TEST_TARGET_NAME: FyrlysMobil
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Fyrlys:
    build:
      targets:
        Fyrlys: all
        FyrlysUITests: [test]
    test:
      targets:
        - FyrlysUITests
      gatherCoverageData: false
  FyrlysMobil:
    build:
      targets:
        FyrlysMobil: all
        FyrlysMobilUITests: [test]
    test:
      targets:
        - FyrlysMobilUITests
      gatherCoverageData: false
